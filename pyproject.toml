[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foci"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "feedparser>=6.0",
    "yt-dlp>=2024.1",
    "trafilatura>=1.9",
    "textual>=0.60",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "peewee>=3.17",
    "fastapi>=0.111",
    "jinja2>=3.1",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.scripts]
foci = "foci.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["foci*"]

[tool.setuptools.package-data]
foci = ["ui/web/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
